name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node-series }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-series: 22.x
            node-version: 22.23.4
          - node-series: 24.x
            node-version: 24.22.1
          - node-series: 26.x
            node-version: 26.12.1

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Run unit tests
        run: npm test

      - name: Collect test coverage
        run: npm run coverage

      - name: Build static release
        run: npm run build

  browser-smoke:
    name: Browser smoke tests
    needs: verify
    # Keep browser dependencies stable across ubuntu-latest image migrations.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use recommended Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: browser-smoke
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use recommended Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Build static release
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
